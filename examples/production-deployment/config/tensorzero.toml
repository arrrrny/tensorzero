# ┌────────────────────────────────────────────────────────────────────────────┐
# │                                   MODELS                                   │
# └────────────────────────────────────────────────────────────────────────────┘

[models."deepseek-chat"]
routing = ["deepseek"]

[models."deepseek-chat".providers.deepseek]
type = "deepseek"
model_name = "deepseek-chat"

[models."deepseek-reasoner"]
routing = ["deepseek"]

[models."deepseek-reasoner".providers.deepseek]
type = "deepseek"
model_name = "deepseek-reasoner"

[models."mistralai/mistral-small-creative"]
routing = ["openrouter"]

[models."mistralai/mistral-small-creative".providers.openrouter]
type = "openrouter"
model_name = "mistralai/mistral-small-creative"

[models."xiaomi/mimo-v2-flash:free"]
routing = ["openrouter"]

[models."xiaomi/mimo-v2-flash:free".providers.openrouter]
type = "openrouter"
model_name = "xiaomi/mimo-v2-flash:free"


[models."moonshotai/kimi-k2:free"]
routing = ["openrouter"]

[models."moonshotai/kimi-k2:free".providers.openrouter]
type = "openrouter"
model_name = "moonshotai/kimi-k2:free"

[models."cognitivecomputations/dolphin-mistral-24b-venice-edition:free"]
routing = ["openrouter"]

[models."cognitivecomputations/dolphin-mistral-24b-venice-edition:free".providers.openrouter]
type = "openrouter"
model_name = "cognitivecomputations/dolphin-mistral-24b-venice-edition:free"

[models."google/gemma-3-27b-it:free"]
routing = ["openrouter"]

[models."google/gemma-3-27b-it:free".providers.openrouter]
type = "openrouter"
model_name = "google/gemma-3-27b-it:free"

